name: Deploy BralaBlog to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build
        env:
          PUBLIC_SITE_URL: https://yun117.fun
          PUBLIC_BASE_PATH: /

      - name: Prepare Cloudflare assets
        run: |
          cp -a dist dist-preview
          rm -f dist-preview/pio/models/live2d/snow_miku/textures/texture_00.png
          rm -f "dist-preview/pio/models/spine/firefly/audio/使一颗心免于哀伤-哼唱.wav"

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.BRALA_GITHUB_CLIENT_ID || secrets.BRALA_GITHUBCLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.BRALA_GITHUB_CLIENT_SECRET }}
          GITHUB_REPO_TOKEN: ${{ secrets.BRALA_GITHUB_REPO_TOKEN }}
        run: |
          printf '%s' "$GITHUB_CLIENT_ID" | pnpm exec wrangler secret put GITHUB_CLIENT_ID
          printf '%s' "$GITHUB_CLIENT_SECRET" | pnpm exec wrangler secret put GITHUB_CLIENT_SECRET
          printf '%s' "$GITHUB_REPO_TOKEN" | pnpm exec wrangler secret put GITHUB_REPO_TOKEN

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 286265df450b08e395609e02933f9d9b
          command: deploy
